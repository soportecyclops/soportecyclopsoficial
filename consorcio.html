<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Consorcios | Soporte Cyclops</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 500px; 
            width: 90%;
        }
        h1 { color: #1a365d; margin-bottom: 15px; font-size: 2rem; }
        p { font-size: 1.1rem; color: #666; margin-bottom: 35px; line-height: 1.6; }
        .btn { 
            background-color: #3182ce; 
            color: white; 
            padding: 15px 35px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 1.2rem; 
            transition: background-color 0.3s; 
            display: inline-block; 
        }
        .btn:hover { background-color: #2b6cb0; }
        .tag {
            background-color: #bee3f8;
            color: #2c5282;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            vertical-align: middle;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Soporte Cyclops <span class="tag">BETA</span></h1>
        <p>Bienvenido a nuestra nueva plataforma de gestión de consorcios. Transparencia, agilidad y comunicación directa para tu edificio.</p>
        
        <!-- ENLACE ACTUALIZADO APUNTANDO AL NUEVO DOMINIO OFICIAL -->
        <a href="https://consorcio.soportecyclops.com.ar" class="btn">Ingresar al Sistema</a>
    </div>
</body>
</html>
